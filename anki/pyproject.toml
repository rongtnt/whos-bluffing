# Dev environment only. The add-on itself needs nothing beyond the Python stdlib and
# the aqt/anki that ship inside Anki desktop.
[project]
name = "whosbluffing-anki-dev"
version = "0.1.0"
description = "Dev/test environment for the Who's Bluffing Anki add-on (not installed into Anki)"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["aqt==26.9.3", "anki==26.9.3", "pytest>=9", "genanki>=0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
