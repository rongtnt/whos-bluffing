<!doctype html>
<!-- Template for public/og.png (1200x630). Rendered once by `node design/render.js assets`; the PNG is committed.
     The lockup leads (the mark, then the name), then the tagline and the address. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../public/styles.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; justify-content: center; padding: 0 96px; background: var(--bg); }
  .lockup { display: flex; align-items: center; gap: 28px; margin: 0; font-size: 112px; font-weight: 800; line-height: 1; letter-spacing: -0.035em; color: var(--text); }
  .sub { max-width: 21em; margin: 44px 0 0; font-size: 40px; line-height: 1.3; color: var(--muted); }
  .url { margin: 40px 0 0; font-family: var(--font); font-size: 38px; font-weight: 800; color: var(--accent); }
</style>
</head>
<body>
  <p class="lockup"><svg class="mark" viewBox="0 0 38 44" aria-hidden="true"><g transform="rotate(-14 16.5 20)"><rect class="back" x="4.00" y="2.50" width="25" height="35" rx="5.5"/></g><g transform="rotate(9 22.5 24)"><rect class="front" x="10.00" y="6.50" width="25" height="35" rx="5.5"/><g transform="rotate(45 22.5 24)"><rect class="pip" x="17.75" y="19.25" width="9.5" height="9.5" rx="1.6"/></g></g></svg><span>Who's Bluffing?</span></p>
  <p class="sub">Ten questions. Stake how sure you are. The scoring rule knows when you're bluffing.</p>
  <p class="url">whosbluffing.com</p>
</body>
</html>
