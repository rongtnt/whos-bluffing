<!doctype html>
<!-- The opening of the press clips (render.js demo): on the navy tile, the mark's two cards rise and fan open (back card
     to -14 degrees, front to +9), the pip flips once, then "Think you know things?" and "Prove it." fade in. 4.0 s, CSS
     animation only. 1080x1920 by default; ?w=1080&h=1080 for the square cut (any size works: the type is a twelfth of
     the frame height, capped by the width). ?t=2.5 shows the frame at 2.5 s; render.js calls seek(ms) for every frame. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro</title>
<link rel="stylesheet" href="../public/styles.css">
<style>
  :root { --spring: cubic-bezier(0.2, 0.9, 0.3, 1.4); --out: cubic-bezier(0.22, 1, 0.36, 1); scrollbar-gutter: auto; }
  html, body { width: var(--w); height: var(--h); margin: 0; overflow: hidden; background: #111827; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box;
    padding: 0 calc(var(--w) * 0.1); color: #F5F3EE; font: 800 var(--fs)/1.08 var(--font); letter-spacing: -0.03em; text-align: center; }

  .mark { position: relative; flex: none; width: calc(var(--u) * 38); height: calc(var(--u) * 44); margin-bottom: calc(var(--fs) * 0.85); }
  .slot { position: absolute; width: calc(var(--u) * 25); height: calc(var(--u) * 35); animation: rise 0.8s var(--spring) both; }
  .slot.back { left: calc(var(--u) * 4); top: calc(var(--u) * 2.5); animation-delay: 0.25s; }
  .slot.front { left: calc(var(--u) * 10); top: calc(var(--u) * 6.5); animation-delay: 0.35s; }
  .card { position: absolute; inset: 0; border-radius: calc(var(--u) * 5.5); animation: 0.7s var(--spring) both; }
  .back .card { background: #7A95FF; animation-name: fan-back; animation-delay: 1.05s; }
  .front .card { background: #F5F3EE; animation-name: fan-front; animation-delay: 1.1s; }
  .flip { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 9.5); height: calc(var(--u) * 9.5); margin: calc(var(--u) * -4.75);
    animation: flip 0.5s cubic-bezier(0.45, 0, 0.55, 1) 1.85s both; }
  .pip { position: absolute; inset: 0; border-radius: calc(var(--u) * 1.6); background: #111827; transform: rotate(45deg); }

  p { margin: 0; text-wrap: balance; animation: line 0.6s var(--out) both; }
  .one { animation-delay: 2.45s; }
  .two { margin-top: calc(var(--fs) * 0.25); color: #7A95FF; animation-delay: 3.15s; }

  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 26)); } to { opacity: 1; transform: none; } }
  @keyframes fan-back { from { transform: none; } to { transform: rotate(-14deg); } }
  @keyframes fan-front { from { transform: none; } to { transform: rotate(9deg); } }
  @keyframes flip { from { transform: scaleX(1); } to { transform: scaleX(-1); } }
  @keyframes line { from { opacity: 0; transform: translateY(0.18em); } to { opacity: 1; transform: none; } }
</style>
<script>
  const q = new URLSearchParams(location.search);
  const w = Number(q.get('w')) || 1080;
  const h = Number(q.get('h')) || 1920;
  const fs = Math.min(h / 12, w * 0.12);
  document.documentElement.style.cssText = `--w: ${w}px; --h: ${h}px; --fs: ${fs}px; --u: ${(fs * 2.6) / 44}px`;
  // Every animation at time ms, paused there.
  window.seek = (ms) => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; } };
  if (q.has('t')) addEventListener('load', () => seek(Number(q.get('t')) * 1000));
</script>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <div class="slot back"><i class="card"></i></div>
    <div class="slot front"><i class="card"><span class="flip"><b class="pip"></b></span></i></div>
  </div>
  <p class="one">Think you know things?</p>
  <p class="two">Prove it.</p>
</body>
</html>
