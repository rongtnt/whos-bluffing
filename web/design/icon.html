<!doctype html>
<!-- Template for public/favicon-32.png and public/apple-touch-icon.png: public/favicon.svg filling the viewport.
     Rendered once by `node design/render.js assets` at 32x32 and 180x180; the PNGs are committed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  img { display: block; width: 100vw; height: 100vh; }
  .solid { background: #111827; } /* apple-touch-icon: iOS shows transparent corners as black, so fill them */
</style>
</head>
<body>
<img src="../public/favicon.svg" alt="">
</body>
</html>
