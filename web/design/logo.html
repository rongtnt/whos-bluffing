<!doctype html>
<!-- Template for public/press/logo.png and logo-dark.png (1280x320, transparent): the lockup, the name with the mark as
     its question mark. Rendered by `node design/render.js assets` (body.dark = light pieces and text for dark
     backgrounds); the PNGs are committed. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../public/styles.css">
<style>
  html, body { width: 1280px; height: 320px; margin: 0; overflow: hidden; background: transparent; }
  body { display: flex; align-items: baseline; justify-content: center; gap: 18px; padding-top: 70px; box-sizing: border-box; color: #111827; font: 800 120px/1 var(--font); letter-spacing: -0.035em; }
  .mark { width: calc(1.3em * 28 / 60); height: 1.3em; }
  .mark .p { fill: #111827; }
  .mark .m { fill: #2F5BFF; }
  body.dark { color: #E6EDF3; }
  body.dark .mark .p { fill: #F5F3EE; }
  body.dark .mark .m { fill: #7A95FF; }
</style>
</head>
<body>
  <span>Who's Bluffing</span><svg class="mark" viewBox="0 0 28 60" aria-hidden="true"><rect class="p" x="0" y="0" width="28" height="10" rx="3"/><rect class="p" x="18" y="12.2" width="10" height="12" rx="3"/><g transform="rotate(-52 18.5 29.5)"><rect class="p" x="10.5" y="24.5" width="16" height="10" rx="3"/></g><rect class="p" x="9" y="36.5" width="10" height="8" rx="3"/><g transform="rotate(45 14 52.9)"><rect class="p m" x="9.6" y="48.5" width="8.8" height="8.8" rx="2.5"/></g></svg>
</body>
</html>
