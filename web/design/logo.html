<!doctype html>
<!-- Template for public/press/logo.png and logo-dark.png (1280x320, transparent): the lockup, the mark then the name.
     Colours follow brand/mark.svg (dark ink, the pip in paper) and, with body.dark, brand/mark-white.svg (light ink, the
     pip in navy). Rendered by `node design/render.js assets`; the PNGs are committed. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../public/styles.css">
<style>
  html, body { width: 1280px; height: 320px; margin: 0; overflow: hidden; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; gap: 30px; color: #111827; font: 800 116px/1 var(--font); letter-spacing: -0.035em; }
  .mark .back { fill: #2F5BFF; }
  .mark .front { fill: #111827; }
  .mark .pip { fill: #FBFAF7; }
  body.dark { color: #E6EDF3; }
  body.dark .mark .back { fill: #7A95FF; }
  body.dark .mark .front { fill: #F5F3EE; }
  body.dark .mark .pip { fill: #111827; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 38 44" aria-hidden="true"><g transform="rotate(-14 16.5 20)"><rect class="back" x="4.00" y="2.50" width="25" height="35" rx="5.5"/></g><g transform="rotate(9 22.5 24)"><rect class="front" x="10.00" y="6.50" width="25" height="35" rx="5.5"/><g transform="rotate(45 22.5 24)"><rect class="pip" x="17.75" y="19.25" width="9.5" height="9.5" rx="1.6"/></g></g></svg><span>Who's Bluffing?</span>
</body>
</html>
