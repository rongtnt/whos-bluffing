# Slack app manifest for HowSure. Replace YOUR-WORKER-HOST (3 places) with your Worker's host,
# e.g. howsure-slack.your-subdomain.workers.dev, then paste this at https://api.slack.com/apps
# -> Create New App -> From an app manifest.
display_information:
  name: HowSure
  description: One question a day in your channel. Pick A or B, say how sure you are, and see who was bluffing at the reveal.
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: HowSure
    always_online: true
  slash_commands:
    - command: /howsure
      url: https://YOUR-WORKER-HOST/slack/events
      description: Post today's question, reveal the answer, set the channel, or see the leaderboard
      usage_hint: "[setup #channel hour roast on|off | reveal | stats]"
      should_escape: true
oauth_config:
  redirect_urls:
    - https://YOUR-WORKER-HOST/slack/oauth/callback
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - channels:read
      - groups:read
      - users:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-WORKER-HOST/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
