# Slack app manifest for Who's Bluffing. Replace whosbluffing-slack.rongaijun41.workers.dev (3 places) with your Worker's host,
# e.g. whosbluffing-slack.your-subdomain.workers.dev, then paste this at https://api.slack.com/apps
# -> Create New App -> From an app manifest.
display_information:
  name: "Who's Bluffing"
  description: One question a day in your channel. Pick A or B, say how sure you are, and see who was bluffing at the reveal.
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: whosbluffing # the @handle members use: /invite @whosbluffing
    always_online: true
  slash_commands:
    - command: /bluff
      url: https://whosbluffing-slack.rongaijun41.workers.dev/slack/events
      description: Post today's question, reveal the answer, set the channel, or see the leaderboard
      usage_hint: "[setup #channel hour roast on|off | reveal | stats]"
      should_escape: true
oauth_config:
  redirect_urls:
    - https://whosbluffing-slack.rongaijun41.workers.dev/slack/oauth/callback
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - channels:read
      - groups:read
      - users:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://whosbluffing-slack.rongaijun41.workers.dev/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
