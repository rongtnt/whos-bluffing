name = "whosbluffing-slack"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Hourly: each run reveals due questions, posts Monday recaps, and posts to the workspaces whose UTC post hour has come.
# The brief said "0 14 * * *"; that cannot honour `/bluff setup #channel [HH]`. See NOTES.md.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "whosbluffing-slack"
# Placeholder. Replace it with the id printed by `npx wrangler d1 create whosbluffing-slack`.
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Origin of the web deployment that serves /api/round/* (no trailing slash, no /api).
API_BASE = "https://whosbluffing.pages.dev"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
# SLACK_CLIENT_ID, SLACK_CLIENT_SECRET, SLACK_SIGNING_SECRET, SALT, BOT_KEY
