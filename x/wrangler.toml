name = "whosbluffing-x"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every two minutes: look for new posts from the watched accounts and page the owner with reply drafts.
[triggers]
crons = ["*/2 * * * *"]

# Remembers the newest post id seen per watched account. Create once with `npx wrangler kv namespace create STATE`
# and paste the id it prints.
[[kv_namespaces]]
binding = "STATE"
id = "0659c32fe5794865b6db3184a813bb9c"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
# X_BEARER_TOKEN                      app-only token, reads the watched timelines
# X_API_KEY, X_API_SECRET             the app's consumer key pair (OAuth 1.0a)
# X_ACCESS_TOKEN, X_ACCESS_SECRET     @whos_bluffing's access token pair (OAuth 1.0a, Read and Write)
# ALERT_WEBHOOK                       Discord webhook URL of the private alerts channel
# BOT_KEY                             shared secret for POST /post (same value as the web and bot Workers)
