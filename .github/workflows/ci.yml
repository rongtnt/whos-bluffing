name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: system libraries for headless PyQt6 (aqt import test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libglib2.0-0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2t64 > /dev/null
      - name: install dev deps
        run: |
          (cd web && npm ci --no-audit --no-fund)
          (cd slack && npm ci --no-audit --no-fund)
          (cd discord && npm ci --no-audit --no-fund)
          (cd anki && uv sync --quiet)
      - name: repo-wide acceptance check
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/check.sh
